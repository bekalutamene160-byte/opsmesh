<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPSMESH -- Redirecting</title>
  <link rel="stylesheet" href="/ui/css/app.css?v=7">
  <!--
    Stage B Phase 5 (P0: OAuth removal): the Google OAuth login page is gone.
    In single_user_demo mode (the default), visiting / opens the dashboard
    directly. This file remains only to redirect any stale bookmarks/links
    to the dashboard. The Google Identity Services script and OAuth button
    rendering have been removed so no half-active OAuth code ships.

    To re-enable multi-user Google OAuth for a production deployment, set
    OPSMESH_ACCESS_MODE=multi_user + OPSMESH_GOOGLE_OAUTH_CLIENT_ID +
    OPSMESH_SESSION_SECRET, then restore the OAuth login UI from git history
    (commit prior to Stage B Phase 5).
  -->
  <meta http-equiv="refresh" content="0; url=/ui/dashboard.html">
</head>
<body class="login-page">
  <div class="login-card">
    <h1><span style="color: var(--accent);">*</span> OPSMESH</h1>
    <div class="subtitle">Opening the dashboard&hellip;</div>
    <div class="hint">
      If you are not redirected automatically, <a href="/ui/dashboard.html">click here</a>.
    </div>
  </div>
  <script>
    // Hard redirect for browsers that ignore meta-refresh, or for same-origin nav.
    window.location.replace("/ui/dashboard.html");
  </script>
</body>
</html>
