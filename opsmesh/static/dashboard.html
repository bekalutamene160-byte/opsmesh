<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPSMESH -- Overview</title>
  <link rel="stylesheet" href="/ui/css/app.css?v=8">
</head>
<body>
  <div id="root">
    <div style="padding: 40px; text-align: center; color: #9aa3b2; font-family: sans-serif;">
      <p style="font-size: 18px;">Loading OPSMESH...</p>
      <p style="font-size: 13px; color: #6b7280;">If this persists, press F12 and check the Console for errors.</p>
    </div>
  </div>

  <script src="/ui/js/app.js?v=8"></script>
  <script src="/ui/js/shell.js?v=8"></script>
  <script>
    (async function () {
      try {
      const ok = await OPSMESH.auth.requireAuth();
      if (!ok) return;

      const root = document.getElementById("root");
      root.innerHTML = OPSMESH.renderShell("overview", "" +
        '<div class="page-header">' +
          '<h1>Overview</h1>' +
          '<div class="meta" id="generated-at">--</div>' +
        "</div>" +

        '<div id="action-banner"></div>' +

        '<div id="metrics" class="stat-grid"></div>' +

        '<div id="pending-card" class="card action-card">' +
          '<h2>Pending approvals</h2>' +
          '<div id="pending-approvals"></div>' +
        "</div>" +

        '<div class="card">' +
          '<h2>Runs by state</h2>' +
          '<div id="state-chart"></div>' +
        "</div>" +

        '<div class="card">' +
          '<h2>Recent runs</h2>' +
          '<div id="recent-runs"></div>' +
        "</div>" +

        '<div class="card">' +
          '<h2>Dead-letter queue</h2>' +
          '<div id="dlq"></div>' +
        "</div>"
      );
      OPSMESH.attachShellHandlers();

      const ui = OPSMESH.ui;
      const api = OPSMESH.api;

      ui.showLoading("#recent-runs");
      ui.showLoading("#pending-approvals");
      ui.showLoading("#dlq");
      ui.showLoading("#metrics");

      try {
        const dash = await api.get("/api/v1/dashboard");
        const m = dash.metrics || {};

        document.getElementById("generated-at").textContent =
          "Generated " + ui.relativeTime(m.generated_at);

        // Enhanced metrics with token usage
        var successRate = m.runs ? (m.runs.success_rate * 100).toFixed(1) : "0.0";
        var successCls = parseFloat(successRate) >= 80 ? "success" : parseFloat(successRate) >= 50 ? "warning" : "danger";
        var costUsd = m.cost ? (m.cost.total_usd_24h || 0) : 0;

        document.getElementById("metrics").innerHTML = [] +
          stat("Runs (24h)", m.runs ? m.runs.total_24h : 0, "info") +
          stat("Success rate", successRate + "%", successCls) +
          stat("Cost (24h)", "$" + costUsd.toFixed(6), "warning",
               m.runs ? m.runs.succeeded_24h + " sent / " + m.runs.failed_24h + " failed" : "") +
          stat("p95 latency", m.runs ? (m.runs.p95_latency_ms || 0).toFixed(0) + " ms" : "0 ms", "info") +
          stat("Queue depth", m.queue ? m.queue.depth : 0, "info") +
          stat("DLQ depth", m.queue ? m.queue.dlq_depth : 0, "danger") +
          stat("Pending approvals", m.approvals ? m.approvals.pending_count : 0, "warning") +
          stat("LLM errors", m.providers && m.providers.llm
            ? (m.providers.llm.error_rate * 100).toFixed(1) + "%"
            : "0.0%", "info");

        // Stage B Phase 7: runs-by-state bar chart (inline SVG, no library).
        renderStateChart(dash.recent_runs || []);

        // Recent runs with token + cost display
        const runs = dash.recent_runs || [];
        if (runs.length === 0) {
          ui.showEmpty("#recent-runs", "No runs yet",
            "Create a lead or connect a Tally form to start.");
        } else {
          document.getElementById("recent-runs").innerHTML =
            '<div class="table-wrap"><table>' +
            "<thead><tr><th>Run</th><th>Lead</th><th>State</th><th>Cost</th><th>Updated</th><th>Error</th></tr></thead>" +
            "<tbody>" + runs.map(function (r) {
              return "<tr onclick=\"window.location.href='/ui/runs.html?id=" + encodeURIComponent(r.run_id) + "'\">" +
                "<td><code>" + ui.escape(r.run_id) + "</code></td>" +
                "<td><code>" + ui.escape(r.lead_id) + "</code></td>" +
                "<td>" + ui.stateBadge(r.state) + "</td>" +
                "<td>$" + (r.cost_usd || 0).toFixed(6) + "</td>" +
                "<td>" + ui.relativeTime(r.updated_at) + "</td>" +
                "<td>" + (r.last_error
                  ? '<span style="color: var(--danger); font-size: 12px;">' + ui.escape(r.last_error.slice(0, 50)) + "...</span>"
                  : '<span style="color: var(--text-mute);">--</span>') + "</td>" +
                "</tr>";
            }).join("") + "</tbody></table></div>";
        }

        // Pending approvals -- promoted to the top + action banner.
        // The banner is a prominent CTA so the operator cannot miss that a
        // human decision is blocking the run. The card below shows the
        // subject inline so they can triage without clicking each row.
        const pending = dash.pending_approvals || [];
        const bannerEl = document.getElementById("action-banner");
        const pendingCard = document.getElementById("pending-card");
        if (pending.length === 0) {
          bannerEl.innerHTML = "";
          pendingCard.style.display = "none";
        } else {
          pendingCard.style.display = "";
          bannerEl.innerHTML =
            '<div class="action-banner">' +
              '<div class="action-banner-icon">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' +
              '</div>' +
              '<div class="action-banner-text">' +
                '<div class="action-banner-title">' + pending.length + ' approval' + (pending.length === 1 ? '' : 's') + ' waiting for your decision</div>' +
                '<div class="action-banner-sub">The run is paused until you approve or reject the drafted email.</div>' +
              '</div>' +
              '<a class="btn primary" href="/ui/approvals.html">Review now &rarr;</a>' +
            '</div>';

          document.getElementById("pending-approvals").innerHTML =
            '<div class="table-wrap"><table>' +
            "<thead><tr><th>Gate</th><th>Subject / Summary</th><th>Recipient</th><th>Run</th><th>Updated</th><th></th></tr></thead>" +
            "<tbody>" + pending.map(function (r) {
              var gate = r.gate || (r.state === "awaiting_approval" ? "Gate 2" : "Gate 1");
              var gateCls = r.state === "awaiting_approval" ? "warning" : "info";
              var subj = r.draft_subject || r.summary || '<span class="text-mute">—</span>';
              var recip = r.draft_recipient || r.recipient || '<span class="text-mute">—</span>';
              return "<tr onclick=\"window.location.href='/ui/approvals.html?id=" + encodeURIComponent(r.pending_approval_id) + "'\">" +
                "<td><span class='badge " + gateCls + "'>" + ui.escape(gate) + "</span></td>" +
                "<td><strong>" + ui.escape(subj) + "</strong></td>" +
                "<td><code>" + ui.escape(recip) + "</code></td>" +
                "<td><code>" + ui.escape(r.run_id) + "</code></td>" +
                "<td>" + ui.relativeTime(r.updated_at) + "</td>" +
                "<td><a class='btn small primary' href='/ui/approvals.html?id=" + encodeURIComponent(r.pending_approval_id) + "'>Review &rarr;</a></td>" +
                "</tr>";
            }).join("") + "</tbody></table></div>";
        }

        // DLQ
        const dlq = dash.dlq_items || [];
        if (dlq.length === 0) {
          ui.showEmpty("#dlq", "No dead-lettered jobs");
        } else {
          document.getElementById("dlq").innerHTML =
            '<div class="table-wrap"><table>' +
            "<thead><tr><th>Job</th><th>Run</th><th>Attempts</th><th>Last error</th></tr></thead>" +
            "<tbody>" + dlq.map(function (j) {
              return "<tr><td><code>" + ui.escape(j.job_id) + "</code></td>" +
                "<td><code>" + ui.escape(j.run_id || "--") + "</code></td>" +
                "<td>" + (j.attempts || 0) + "</td>" +
                "<td>" + ui.escape(j.last_error || "--") + "</td></tr>";
            }).join("") + "</tbody></table></div>";
        }
      } catch (e) {
        ui.showError("#recent-runs", e.message);
        ui.toast("Failed to load: " + e.message, "danger");
      }

      function stat(label, value, kind, sub) {
        return '<div class="stat"><div class="label">' + ui.escape(label) + "</div>" +
          '<div class="value ' + (kind || "") + '">' + ui.escape(value) + "</div>" +
          (sub ? '<div class="sub">' + ui.escape(sub) + "</div>" : "") + "</div>";
      }

      // Stage B Phase 7: runs-by-state horizontal bar chart (inline SVG).
      function renderStateChart(runs) {
        var el = document.getElementById("state-chart");
        if (!el) return;
        var counts = {};
        runs.forEach(function (r) {
          var s = r.state || "unknown";
          counts[s] = (counts[s] || 0) + 1;
        });
        var states = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
        if (states.length === 0) {
          el.innerHTML = '<div class="empty" style="padding: 24px; color: var(--text-mute);">No runs to chart yet.</div>';
          return;
        }
        var max = Math.max.apply(null, states.map(function (s) { return counts[s]; }));
        var barColor = { sent: "#34d399", failed: "#f87171", awaiting_approval: "#fbbf24", awaiting_evidence_review: "#fbbf24", send_unknown: "#fbbf24", rejected: "#f87171", researching: "#60a5fa", qualifying: "#60a5fa", drafting: "#60a5fa", critic: "#60a5fa" };
        var rows = states.map(function (s) {
          var w = Math.round((counts[s] / max) * 100);
          var color = barColor[s] || "#9aa3b2";
          return '<div class="chart-row">' +
            '<div class="chart-label">' + ui.escape(s) + '</div>' +
            '<div class="chart-track"><div class="chart-bar" style="width:' + w + '%; background:' + color + ';"></div></div>' +
            '<div class="chart-count">' + counts[s] + '</div>' +
          '</div>';
        }).join("");
        el.innerHTML = '<div class="chart">' + rows + '</div>';
      }
      } catch (err) {
        document.getElementById("root").innerHTML =
          '<div style="padding: 40px; color: #e74c3c; font-family: sans-serif;">' +
          '<h2 style="margin: 0 0 12px;">JavaScript Error</h2>' +
          '<p style="font-size: 14px; word-break: break-word;">' + (err && err.message ? err.message : String(err)) + '</p>' +
          '<p style="font-size: 12px; color: #6b7280; margin-top: 16px;">' +
          'If this persists, clear your browser cache or try an incognito window.</p>' +
          '</div>';
        console.error("OPSMESH dashboard error:", err);
      }
    })();
  </script>
</body>
</html>
