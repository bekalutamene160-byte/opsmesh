[project]
name = "opsmesh"
version = "0.1.0"
description = "OPSMESH — Evidence-aware, human-supervised B2B Lead-to-Opportunity Operations Agent"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "ASYNC"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "unit: unit tests (no external deps)",
    "integration: integration tests (real DB)",
    "security: security tests (prompt injection, cross-workspace, etc.)",
    "failure: failure-injection tests",
    "eval: evaluation scenarios",
]

[tool.coverage.run]
source = ["opsmesh"]
omit = ["tests/*", "opsmesh/eval/*"]
