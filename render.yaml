# Render deployment configuration for OPSMESH.
# https://render.com/docs/blueprint-spec
#
# Deploy:
#   1. Push this repo to GitHub
#   2. Go to render.com → New → Blueprint
#   3. Connect your GitHub repo
#   4. Render reads this file and creates all services
#   5. Set the secret env vars in the Render dashboard

databases:
  - name: opsmesh-db
    plan: free
    ipAllowList: []

services:
  # ---------------------------------------------------------------------------
  # API service (web)
  # ---------------------------------------------------------------------------
  - type: web
    name: opsmesh-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn opsmesh.api.app:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPSMESH_DATABASE_URL
        fromDatabase:
          name: opsmesh-db
          property: connectionString
      # --- Access mode (Stage B Phase 5) ---
      - key: OPSMESH_ACCESS_MODE
        value: single_user_demo
      - key: OPSMESH_DEMO_WORKSPACE_ID
        value: default
      # --- Demo-mode safety guards (Stage B Phase 1) ---
      # Set to your Resend account's verified test recipient before going live.
      - key: OPSMESH_EMAIL_TEST_RECIPIENT
        sync: false
      - key: OPSMESH_CRM_DEMO_MODE
        value: read_only
      # --- Providers ---
      - key: OPSMESH_LLM_PROVIDER
        value: groq
      - key: OPSMESH_LLM_API_KEY
        sync: false
      - key: OPSMESH_LLM_DEFAULT_MODEL
        value: openai/gpt-oss-120b
      - key: OPSMESH_RESEARCH_PROVIDER
        value: exa
      - key: OPSMESH_EXA_API_KEY
        sync: false
      - key: OPSMESH_EMAIL_PROVIDER
        value: resend
      - key: OPSMESH_EMAIL_API_KEY
        sync: false
      - key: OPSMESH_EMAIL_KILL_SWITCH
        value: "false"
      - key: OPSMESH_CRM_PROVIDER
        value: hubspot
      - key: OPSMESH_CRM_API_KEY
        sync: false
      # --- Webhook HMAC (REQUIRED in production_mode) ---
      - key: OPSMESH_WEBHOOK_SECRET
        sync: false
      - key: OPSMESH_TALLY_WEBHOOK_SECRET
        sync: false
      # --- Sender identity (Resend pre-verified test sender) ---
      - key: OPSMESH_WORKSPACE_SENDER_IDENTITY
        value: "OpsMesh <onboarding@resend.dev>"
      # --- CORS (empty = same-origin only; the frontend is served at /ui) ---
      - key: OPSMESH_CORS_ALLOWED_ORIGINS
        value: ""
      - key: OPSMESH_PRODUCTION_MODE
        value: "true"
      # NOTE: OPSMESH_GOOGLE_OAUTH_* and OPSMESH_SESSION_SECRET are NOT set —
      # they are only used in OPSMESH_ACCESS_MODE=multi_user. The demo opens
      # directly to the dashboard with no login.

  # ---------------------------------------------------------------------------
  # Worker service (background)
  # ---------------------------------------------------------------------------
  - type: worker
    name: opsmesh-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m opsmesh.worker
    autoDeploy: true
    envVars:
      - key: OPSMESH_DATABASE_URL
        fromDatabase:
          name: opsmesh-db
          property: connectionString
      - key: OPSMESH_ACCESS_MODE
        value: single_user_demo
      - key: OPSMESH_DEMO_WORKSPACE_ID
        value: default
      - key: OPSMESH_EMAIL_TEST_RECIPIENT
        sync: false
      - key: OPSMESH_CRM_DEMO_MODE
        value: read_only
      - key: OPSMESH_LLM_PROVIDER
        value: groq
      - key: OPSMESH_LLM_API_KEY
        sync: false
      - key: OPSMESH_LLM_DEFAULT_MODEL
        value: openai/gpt-oss-120b
      - key: OPSMESH_RESEARCH_PROVIDER
        value: exa
      - key: OPSMESH_EXA_API_KEY
        sync: false
      - key: OPSMESH_EMAIL_PROVIDER
        value: resend
      - key: OPSMESH_EMAIL_API_KEY
        sync: false
      - key: OPSMESH_EMAIL_KILL_SWITCH
        value: "false"
      - key: OPSMESH_CRM_PROVIDER
        value: hubspot
      - key: OPSMESH_CRM_API_KEY
        sync: false
      - key: OPSMESH_WEBHOOK_SECRET
        sync: false
      - key: OPSMESH_TALLY_WEBHOOK_SECRET
        sync: false
      - key: OPSMESH_WORKSPACE_SENDER_IDENTITY
        value: "OpsMesh <onboarding@resend.dev>"
